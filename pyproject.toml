[tool.poetry]
name = "template-code"
version = "0.1.0"
description = ""
authors = ["Thibaud ROBIN <trobin@esgi.com>"]
readme = "README.md"
packages = [
  { include = "src" },
  { include = "tp1", from = "src" },
  { include = "tp3", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
scapy = "^2.6.0"
pygal = "^3.0.5"
fpdf2 = "^2.8.1"
pytest = "^8.3.5"
capstone = "^5.0.6"
python-dotenv = "^1.2.1"
matplotlib = "^3.11.2"
python-magic = { version = "^0.4.27", markers = "sys_platform != 'win32'" }
python-magic-bin = { version = "^0.4.14", markers = "sys_platform == 'win32'" }
lief = "^1.0.0"
yara-python = "^4.5.4"
pydantic = "^2.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tp1 = "tp1.main:main"
tp3 = "tp3.main:main"
tp2 = "tp2.main:main"
[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
